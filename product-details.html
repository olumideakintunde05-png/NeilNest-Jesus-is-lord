<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Product — NeilNest</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #000; --surface-0: #0a0a0a; --surface-1: #101010; --surface-2: #141414;
    --surface-3: #1a1a1a; --surface-4: #1e1e1e;
    --text-primary: #fff; --text-secondary: #a8a8a8; --text-faint: #7a7a7a; --text-dim: #6e6e6e;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --gold: #e0a83c; --gold-deep: #d99a2b; --gold-text-on: #1a1200;
    --success: #37c65f; --danger: #e14b4b;
  }
  [data-theme="light"] {
    --bg: #F7F7F9; --surface-0: #FFFFFF; --surface-1: #FFFFFF; --surface-2: #FFFFFF;
    --surface-3: #F0EFF3; --surface-4: #E8E7EC;
    --text-primary: #1A1A1E; --text-secondary: #46424F; --text-faint: #6B6875; --text-dim: #8A8694;
    --border: #E8E7EC; --border-strong: #DAD8E0;
    --gold: #C7862A; --gold-deep: #B8791F; --gold-text-on: #1a1200;
    --success: #157F41; --danger: #D14343;
  }
  html, body { background: var(--bg); height: 100%; }
  body { font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--text-primary); font-size: 14px; line-height: 1.4; transition: background 0.25s ease, color 0.25s ease; }
  a { text-decoration: none; color: inherit; touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
  a:active, button:active { opacity: 0.72; }

  .app-shell { max-width: 390px; margin: 0 auto; min-height: 100dvh; padding-bottom: 100px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }

  .top-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(10,10,10,0.7); backdrop-filter: blur(6px); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 17px; height: 17px; }
  .top-bar-right { display: flex; gap: 8px; position: relative; }

  /* Gallery */
  .gallery-wrap { margin-top: -50px; position: relative; }
  .gallery-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; aspect-ratio: 4/3.2; -webkit-overflow-scrolling: touch; }
  .gallery-scroll::-webkit-scrollbar { display: none; }
  .gallery-scroll img { width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; flex-shrink: 0; background: var(--surface-2); }
  .gallery-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .gallery-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.35); }
  .gallery-dots span.active { background: var(--gold); width: 16px; border-radius: 3px; }

  .content { padding: 18px 20px 0; }
  .p-name { font-size: 20px; font-weight: 800; line-height: 1.3; }
  .p-price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
  .p-price { font-size: 22px; font-weight: 800; color: var(--gold); }
  .p-negotiable { font-size: 11.5px; color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  .p-meta-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
  .stock-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .stock-pill.in { background: rgba(52,168,83,0.15); color: #8fe3a8; }
  .stock-pill.out { background: rgba(220,80,70,0.15); color: var(--danger); }
  .stock-pill.low { background: rgba(224,168,60,0.15); color: #f0cf8e; }

  .section-heading { font-size: 14px; font-weight: 800; margin: 22px 0 10px; }
  .p-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; }

  /* Business mini-card */
  .biz-card { display: flex; align-items: center; gap: 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 22px; }
  .biz-avatar { width: 46px; height: 46px; border-radius: 12px; object-fit: cover; background: var(--surface-4); flex-shrink: 0; }
  .biz-info { flex: 1; min-width: 0; }
  .biz-name-row { display: flex; align-items: center; gap: 5px; }
  .biz-name { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .biz-badge svg { width: 13px; height: 13px; flex-shrink: 0; }
  .biz-badge.verified svg { color: var(--success); }
  .biz-badge.trusted svg { color: var(--gold); }
  .biz-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .biz-visit-btn { font-size: 11.5px; font-weight: 700; color: var(--gold); padding: 8px 12px; border: 1px solid rgba(224,168,60,0.3); border-radius: 10px; flex-shrink: 0; }

  .safety-notice { display: flex; gap: 9px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; margin-top: 18px; font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
  .safety-notice svg { width: 15px; height: 15px; color: var(--text-dim); flex-shrink: 0; margin-top: 1px; }

  .related-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .related-scroll::-webkit-scrollbar { display: none; }
  .related-card { width: 130px; flex-shrink: 0; }
  .related-card img { width: 130px; height: 100px; border-radius: 12px; object-fit: cover; background: var(--surface-2); }
  .related-card .r-name { font-size: 11.5px; font-weight: 700; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .related-card .r-price { font-size: 11.5px; color: var(--gold); font-weight: 700; margin-top: 2px; }

  /* Sticky action bar */
  .action-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 390px; margin: 0 auto; background: rgba(8,8,8,0.92); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .action-bar .icon-only { width: 50px; height: 50px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .action-bar .icon-only svg { width: 19px; height: 19px; }
  .action-bar .primary-btn { flex: 1; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #f0bd5a, var(--gold-deep)); color: var(--gold-text-on); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .dropdown-panel { position: absolute; top: 46px; right: 0; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px; min-width: 190px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); display: none; z-index: 50; }
  .dropdown-panel.open { display: block; }
  .dropdown-panel button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
  .dropdown-panel button svg { width: 15px; height: 15px; color: var(--text-secondary); }

  .skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: skel 1.4s ease infinite; }
  @keyframes skel { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  #toast-host { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 40px); max-width: 350px; }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 14px; padding: 13px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="top-bar-right">
      <button class="icon-btn" id="shareBtn" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.8M8.6 13.4l6.8 3.8"/></svg></button>
      <button class="icon-btn" id="moreBtn" aria-label="More"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
      <div class="dropdown-panel" id="morePanel">
        <button id="reportProductBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Report Product</button>
      </div>
    </div>
  </div>

  <div class="gallery-wrap">
    <div class="gallery-scroll" id="galleryScroll"></div>
    <div class="gallery-dots" id="galleryDots"></div>
  </div>

  <div class="content">
    <div class="p-name" id="pName">Loading…</div>
    <div class="p-price-row">
      <span class="p-price" id="pPrice"></span>
      <span class="p-negotiable" id="pNegotiable" style="display:none;">Negotiable</span>
    </div>
    <div class="p-meta-row">
      <span class="stock-pill" id="pStock"></span>
      <span id="pCategory"></span>
    </div>

    <div class="section-heading">Description</div>
    <p class="p-desc" id="pDesc"></p>

    <div class="biz-card" id="bizCard">
      <img class="biz-avatar" id="bizAvatar" alt="">
      <div class="biz-info">
        <div class="biz-name-row">
          <span class="biz-name" id="bizName">—</span>
          <span class="biz-badge verified" id="bizVerifiedBadge" style="display:none;"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg></span>
          <span class="biz-badge trusted" id="bizTrustedBadge" style="display:none;" title="Trusted Seller"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 4.8 5.3.8-3.85 3.75.9 5.3L12 14.2l-4.75 2.45.9-5.3L4.3 7.6l5.3-.8z"/></svg></span>
        </div>
        <div class="biz-sub" id="bizSub">—</div>
      </div>
      <a href="#" class="biz-visit-btn" id="bizVisitBtn">Visit</a>
    </div>

    <div class="safety-notice" id="pSafetyNotice"></div>

    <div id="relatedSection" style="display:none;">
      <div class="section-heading">More from this business</div>
      <div class="related-scroll" id="relatedScroll"></div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display:none;">
    <a href="#" class="icon-only" id="callBtn" style="display:none;" aria-label="Call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg></a>
    <a href="#" class="icon-only" id="whatsappBtn" style="display:none;" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20l1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg></a>
    <button class="primary-btn" id="messageBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
      Message Seller
    </button>
  </div>

  <div id="toast-host"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="auth-guard.js"></script>
<script src="billing.js"></script>
<script src="trustsafety-core.js"></script>
<script src="product-details.js"></script>
</body>
</html>
