<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sign In — NeilNest</title>
<script src="theme.js"></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GH6R4GXT58"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-GH6R4GXT58');
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #000; --surface-0: #0a0a0a; --surface-1: #101010; --surface-2: #141414;
    --surface-3: #1a1a1a; --surface-4: #1e1e1e;
    --text-primary: #fff; --text-secondary: #a8a8a8; --text-faint: #7a7a7a; --text-dim: #6e6e6e;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --gold: #e0a83c; --gold-deep: #d99a2b; --gold-text-on: #1a1200;
    --success: #37c65f; --danger: #e14b4b;
  }
  [data-theme="light"] {
    --bg: #F7F7F9; --surface-0: #FFFFFF; --surface-1: #FFFFFF; --surface-2: #FFFFFF;
    --surface-3: #F0EFF3; --surface-4: #E8E7EC;
    --text-primary: #1A1A1E; --text-secondary: #46424F; --text-faint: #6B6875; --text-dim: #8A8694;
    --border: #E8E7EC; --border-strong: #DAD8E0;
    --gold: #C7862A; --gold-deep: #B8791F; --gold-text-on: #1a1200;
    --success: #157F41; --danger: #D14343;
  }
  html, body { background: var(--bg); height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary); font-size: 14px; line-height: 1.4;
    transition: background 0.25s ease, color 0.25s ease;
  }
  a { text-decoration: none; color: inherit; touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
  a, button { -webkit-user-select: none; user-select: none; }
  a:active, button:active { opacity: 0.72; }
  input { font-family: inherit; color: var(--text-primary); }

  .auth-shell {
    max-width: 390px; margin: 0 auto; min-height: 100dvh;
    position: relative; overflow: hidden;
  }

  /* ---------- Background image (drop background.png next to this file) ----------
     This sits BEHIND the logo/title/tagline as one continuous backdrop
     (position:absolute, full width, starting at the very top of the screen)
     and fades to transparent before the "Welcome back" heading. Everything
     else (.auth-content) is layered on top of it with z-index. */
  .earth-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 480px;
    z-index: 0;
    overflow: hidden;
  }
  .earth-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    -webkit-mask-image: linear-gradient(180deg, var(--bg) 55%, transparent 100%);
            mask-image: linear-gradient(180deg, var(--bg) 55%, transparent 100%);
  }

  .auth-content {
    position: relative;
    z-index: 1;
    padding: 8px 24px 40px;
  }

  .auth-back {
    width: 38px; height: 38px; border-radius: 50%; background: rgba(20,20,20,0.7);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
  }

  /* ---------- Logo + hero ---------- */
  .auth-hero { text-align: center; position: relative; }
  .auth-hero__logo {
    width: 120px; height: 120px; margin: 0 auto 4px; display: block;
    filter: drop-shadow(0 0 36px rgba(122,92,255,0.5));
    object-fit: contain;
  }
  .auth-hero__title { font-size: 30px; font-weight: 800; }
  .auth-hero__title .accent { color: var(--gold); }
  .auth-hero__tagline { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; }

  .auth-welcome { margin: 14px 0 20px; }
  .auth-welcome h1 { font-size: 24px; font-weight: 800; }
  .auth-welcome p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }

  /* ---------- Inputs ---------- */
  .field-group { margin-bottom: 16px; }
  .input-wrap {
    display: flex; align-items: center; gap: 10px; height: 54px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; padding: 0 16px;
    transition: border-color 0.15s ease;
  }
  .input-wrap:focus-within { border-color: var(--gold-deep); }
  .input-wrap svg { width: 19px; height: 19px; color: var(--gold); flex-shrink: 0; }
  .input-wrap input {
    flex: 1; background: transparent; border: none; outline: none;
    font-size: 15px; color: var(--text-primary); height: 100%; min-width: 0;
  }
  .input-wrap input::placeholder { color: var(--text-dim); }
  .toggle-visibility { color: var(--text-faint); flex-shrink: 0; padding: 6px; margin: -6px; }

  .auth-options-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 20px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); }
  .forgot-link { color: var(--gold); font-size: 13px; font-weight: 600; }

  /* ---------- Buttons ---------- */
  .btn {
    height: 52px; border-radius: 14px; display: flex; align-items: center;
    justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; width: 100%;
  }
  .btn-primary { background: linear-gradient(135deg, #f0c25c 0%, #dd9c2c 100%); color: var(--gold-text-on); }

  .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--text-dim); font-size: 12px; margin: 22px 0 16px; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .social-row { display: flex; gap: 12px; margin-bottom: 22px; }
  .btn-social {
    height: 52px; flex: 1; border-radius: 14px; background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .btn-social svg { width: 22px; height: 22px; }

  .auth-footer-link { text-align: center; font-size: 13px; color: var(--text-secondary); }
  .auth-footer-link a { color: var(--gold); font-weight: 600; }

  .auth-secure-note {
    text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 16px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .auth-secure-note svg { width: 14px; height: 14px; color: var(--success); }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="earth-bg">
    <img src="background.png" alt="Earth at night" onerror="this.style.opacity=0">
  </div>

  <div class="auth-content">
  <button class="auth-back" onclick="history.back()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="auth-hero">
    <img class="auth-hero__logo" src="logo.png" alt="NeilNest logo" onerror="this.style.opacity=0">
  <!--  <div class="auth-hero__title">Neil<span class="accent">Nest</span></div>
    <div class="auth-hero__tagline">Connect. Grow. Thrive.</div>
  </div> -->

  <div class="auth-welcome">
    <h1>Welcome back,<br> let's continue 👋</h1>
    <p>Sign in to your account to access all features.</p>
  </div>

  <form id="signin-form">
    <div class="field-group">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
        <input id="email" type="text" placeholder="Email or username" autocomplete="username" required>
      </div>
    </div>
    <div class="field-group">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="toggle-visibility" id="toggle-pw">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" id="eye-icon"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-options-row">
      <label class="checkbox-row">
        <input type="checkbox" id="remember-me" checked>
        Remember me
      </label>
      <a href="forget-password.html" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn btn-primary">
      Sign In
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="auth-divider">or continue with</div>

  <div class="social-row">
    <button class="btn-social" id="btn-google">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 35.5 24 35.5c-6.9 0-12.5-5.6-12.5-12.5S17.1 10.5 24 10.5c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.6 4.7 29.6 2.5 24 2.5 12.4 2.5 3 11.9 3 23.5S12.4 44.5 24 44.5c11 0 21-8 21-21 0-1.4-.1-2.4-.4-3z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.7 18.9 12.5 24 12.5c3.2 0 6.1 1.2 8.3 3.2l5.7-5.7C34.6 6.7 29.6 4.5 24 4.5c-7.8 0-14.5 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.3c-2 1.4-4.6 2.3-7.6 2.3-5.3 0-9.7-3.5-11.3-8.3l-6.5 5C9.4 39.9 16.1 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.5 5.3C41.5 36.2 45 30.5 45 23.5c0-1.4-.1-2.4-.4-3z"/></svg>
      <span style="margin-left:10px;font-weight:700;font-size:14.5px;color:var(--text-primary);">Continue with Google</span>
    </button>
  </div>
  <!-- Apple and Facebook sign-in are wired in auth.js (btn-apple / btn-facebook)
       but hidden here until those providers are fully configured in Firebase Console. -->

  <div class="auth-footer-link">Don't have an account? <a href="signup.html">Sign up</a></div>

  <div class="auth-secure-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
    Your data is secured and protected.
  </div>
  </div>
</div>

<script>
  document.getElementById("toggle-pw").addEventListener("click", () => {
    const pw = document.getElementById("password");
    const isHidden = pw.type === "password";
    pw.type = isHidden ? "text" : "password";
    document.getElementById("eye-icon").innerHTML = isHidden
      ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3" stroke-width="1.8"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
  });
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="auth.js"></script>
</body>
</html>
