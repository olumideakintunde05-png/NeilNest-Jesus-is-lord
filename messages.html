<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Messages — NeilNest</title>
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #000; --surface-0: #0a0a0a; --surface-1: #101010; --surface-2: #141414;
    --surface-3: #1a1a1a; --surface-4: #1e1e1e;
    --text-primary: #fff; --text-secondary: #a8a8a8; --text-faint: #7a7a7a; --text-dim: #6e6e6e;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --gold: #e0a83c; --gold-deep: #d99a2b; --gold-text-on: #1a1200;
    --success: #37c65f; --danger: #e14b4b;
  }
  [data-theme="light"] {
    --bg: #F7F7F9; --surface-0: #FFFFFF; --surface-1: #FFFFFF; --surface-2: #FFFFFF;
    --surface-3: #F0EFF3; --surface-4: #E8E7EC;
    --text-primary: #1A1A1E; --text-secondary: #46424F; --text-faint: #6B6875; --text-dim: #8A8694;
    --border: #E8E7EC; --border-strong: #DAD8E0;
    --gold: #C7862A; --gold-deep: #B8791F; --gold-text-on: #1a1200;
    --success: #157F41; --danger: #D14343;
  }
  html, body { background: var(--bg); height: 100%; overscroll-behavior-y: contain; }
  body { font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--text-primary); font-size: 14px; line-height: 1.4; transition: background 0.25s ease, color 0.25s ease; }
  a { text-decoration: none; color: inherit; touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
  a, button { -webkit-user-select: none; user-select: none; }
  a:active, button:active { opacity: 0.72; }
  input, textarea { font-family: inherit; color: var(--text-primary); }

  .app-shell { max-width: 390px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }

  /* ================= LIST VIEW ================= */
  #listView { display: flex; flex-direction: column; height: 100%; padding: 20px 20px 0; }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .top-row-left { display: flex; align-items: center; gap: 12px; }
  .back-btn, .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .top-title { font-size: 20px; font-weight: 800; }

  .search-bar { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
  .search-bar svg { width: 16px; height: 16px; color: var(--text-dim); flex-shrink: 0; }
  .search-bar input { flex: 1; background: none; border: none; outline: none; font-size: 14px; }
  .search-bar input::placeholder { color: var(--text-dim); }

  .conv-scroll { flex: 1; overflow-y: auto; padding-bottom: 16px; -webkit-overflow-scrolling: touch; }
  .conv-item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-radius: 14px; }
  .conv-avatar-wrap { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
  .conv-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: var(--surface-4); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: var(--gold); }
  .conv-online-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; border-radius: 50%; background: var(--success); border: 2.5px solid var(--bg); }
  .conv-body { flex: 1; min-width: 0; }
  .conv-name-row { display: flex; align-items: center; gap: 5px; }
  .conv-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-verified { width: 13px; height: 13px; color: var(--success); flex-shrink: 0; }
  .conv-preview { font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; max-width: 220px; }
  .conv-preview.unread { color: var(--text-primary); font-weight: 600; }
  .conv-meta { text-align: right; flex-shrink: 0; }
  .conv-time { font-size: 11px; color: var(--text-dim); }
  .conv-unread-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--gold-text-on); font-size: 10px; font-weight: 800; margin-top: 5px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state svg { width: 46px; height: 46px; color: var(--text-faint); margin-bottom: 14px; }
  .empty-state .es-title { font-size: 14.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .empty-state .es-sub { font-size: 12.5px; }

  /* ================= CHAT VIEW ================= */
  #chatView { display: none; flex-direction: column; height: 100%; }
  .chat-header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
  .chat-header-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .chat-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--surface-4); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: var(--gold); flex-shrink: 0; }
  .chat-header-name-row { display: flex; align-items: center; gap: 5px; }
  .chat-header-name { font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-header-sub { font-size: 11.5px; color: var(--text-secondary); }
  .chat-header-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .msg-row { display: flex; }
  .msg-row.mine { justify-content: flex-end; }
  .msg-bubble { max-width: 78%; padding: 10px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; }
  .msg-row.mine .msg-bubble { background: linear-gradient(135deg, #f0bd5a, var(--gold-deep)); color: var(--gold-text-on); border-bottom-right-radius: 5px; }
  .msg-row.theirs .msg-bubble { background: var(--surface-2); border: 1px solid rgba(255,255,255,0.06); border-bottom-left-radius: 5px; }
  .msg-bubble.deleted { font-style: italic; opacity: 0.6; }
  .msg-image { max-width: 220px; border-radius: 14px; display: block; margin-top: 2px; }
  .msg-meta { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-faint); margin-top: 4px; }
  .msg-row.mine .msg-meta { justify-content: flex-end; }
  .msg-meta svg { width: 12px; height: 12px; }
  .msg-meta svg.read { color: var(--success); }

  .card-bubble { max-width: 82%; background: var(--surface-2); border: 1px solid rgba(224,168,60,0.25); border-radius: 16px; padding: 12px; display: flex; gap: 10px; align-items: center; }
  .card-bubble img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--surface-4); }
  .card-bubble-body { min-width: 0; flex: 1; }
  .card-bubble-title { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-bubble-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .card-bubble-tag { font-size: 9.5px; font-weight: 800; text-transform: uppercase; color: var(--gold); letter-spacing: 0.3px; margin-bottom: 4px; }

  .typing-row { display: flex; align-items: center; gap: 4px; padding: 4px 13px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: typingBounce 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .chat-input-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
  .chat-input-row input[type="text"] { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 22px; padding: 12px 16px; font-size: 14px; outline: none; }
  .chat-input-row input[type="text"]:focus { border-color: var(--gold-deep); }
  .chat-icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-icon-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #f0bd5a, var(--gold-deep)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn svg { width: 17px; height: 17px; color: var(--gold-text-on); }
  .send-btn[disabled] { opacity: 0.4; pointer-events: none; }

  /* ================= Shared: menus, modals, toasts ================= */
  .dropdown-panel { position: absolute; top: 46px; right: 0; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px; min-width: 190px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); display: none; z-index: 50; }
  .dropdown-panel.open { display: block; }
  .dropdown-panel button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
  .dropdown-panel button svg { width: 15px; height: 15px; color: var(--text-secondary); }
  .dropdown-panel button.danger { color: var(--danger); }
  .dropdown-panel button.danger svg { color: var(--danger); }
  .chat-header-actions { position: relative; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { width: 100%; max-width: 390px; background: var(--surface-1); border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; position: relative; }
  .modal-sheet h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; }
  .modal-submit-btn { width: 100%; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #f0bd5a, var(--gold-deep)); color: var(--gold-text-on); font-weight: 800; font-size: 14px; }
  .modal-submit-btn.danger { background: #c0392b; color: #ffe8e4; }
  textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 13px 14px; font-size: 14px; outline: none; resize: none; min-height: 80px; margin-bottom: 14px; }

  #toast-host { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 40px); max-width: 350px; }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 14px; padding: 13px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

  .desktop-sidebar { display: none; }

  /* =====================================================================
     DESKTOP (≥960px) — real two-pane layout: conversation list on the
     left, chat on the right, both visible at once — instead of the
     mobile single-pane list⇄chat swap.

     messages.js toggles #listView/#chatView via inline style.display to
     switch panes on mobile. The !important rules below intentionally
     override that inline style at this breakpoint only, so both panes
     stay visible regardless of which one the JS thinks is "active." No
     JS changes needed — this is CSS-only.
  ===================================================================== */
  @media (min-width: 960px) {
    body { display: flex; }
    .desktop-sidebar {
      display: flex; flex-direction: column; gap: 4px;
      position: fixed; left: 0; top: 0; bottom: 0; width: 232px;
      padding: 24px 14px; background: var(--surface-0); border-right: 1px solid var(--border);
      z-index: 50;
    }
    .desktop-sidebar__brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
    .desktop-sidebar__brand img { width: 34px; height: 34px; }
    .desktop-sidebar__brand-name { font-size: 17px; font-weight: 700; }
    .desktop-sidebar a.nav-item {
      flex: none; flex-direction: row; justify-content: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 12px; color: var(--text-secondary); position: static;
    }
    .desktop-sidebar a.nav-item svg { width: 20px; height: 20px; }
    .desktop-sidebar a.nav-item span:not(.nav-item__badge) { font-size: 14px; font-weight: 600; }
    .desktop-sidebar a.nav-item.active { background: rgba(224,168,60,0.12); color: var(--gold); }
    .desktop-sidebar a.nav-item:hover { background: rgba(255,255,255,0.05); }
    .desktop-sidebar a.nav-item .nav-item__badge { position: static; margin-left: auto; }

    .app-shell {
      max-width: none; width: calc(100% - 232px); margin: 0 0 0 232px;
      flex-direction: row; height: 100vh;
    }
    #listView {
      display: flex !important; width: 360px; flex-shrink: 0;
      border-right: 1px solid var(--border); padding: 20px 20px 0;
    }
    #chatView { display: flex !important; flex: 1; min-width: 0; height: 100%; }
    #chatView .back-btn { display: none !important; }
    .msg-bubble { max-width: min(78%, 480px); }
    #chatScroll:empty::before {
      content: "Select a conversation to start chatting";
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 0 40px;
    }
  }
</style>
</head>
<body>

<nav class="desktop-sidebar">
  <div class="desktop-sidebar__brand">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <span class="desktop-sidebar__brand-name">NeilNest</span>
  </div>
  <a href="home.html" class="nav-item" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <span>Home</span>
  </a>
  <a href="directory.html" class="nav-item" data-page="directory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Directory</span>
  </a>
  <a href="add-business.html" class="nav-item" data-page="add-business">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add Business</span>
  </a>
  <a href="messages.html" class="nav-item active" data-page="messages" style="position:relative;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
    <span>Messages</span>
  </a>
  <a href="business-profile.html" class="nav-item" data-page="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profile</span>
  </a>
</nav>

<div class="app-shell" id="appShell">

  <!-- ============ LIST VIEW ============ -->
  <div id="listView">
    <div class="top-row">
      <div class="top-row-left">
        <a href="home.html" class="back-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="top-title">Messages</div>
      </div>
    </div>

    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search conversations...">
    </div>

    <div class="conv-scroll" id="convScroll">
      <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v12H8l-4 4V4z"/></svg><div class="es-title">Loading conversations…</div></div>
    </div>
  </div>

  <!-- ============ CHAT VIEW ============ -->
  <div id="chatView">
    <div class="chat-header">
      <button class="back-btn" id="chatBackBtn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="chat-header-info" id="chatHeaderInfo">
        <div class="chat-avatar" id="chatAvatar">?</div>
        <div>
          <div class="chat-header-name-row">
            <span class="chat-header-name" id="chatName">—</span>
            <svg class="conv-verified" id="chatVerifiedBadge" style="display:none;" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M8 12l2.5 2.5L16 9" stroke="var(--bg)" stroke-width="2" fill="none"/></svg>
          </div>
          <div class="chat-header-sub" id="chatSub">—</div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" id="chatCallBtn" style="display:none;" aria-label="Call"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg></button>
        <button class="icon-btn" id="chatWhatsappBtn" style="display:none;" aria-label="WhatsApp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20l1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg></button>
        <button class="icon-btn" id="chatMenuBtn" aria-label="More"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
        <div class="dropdown-panel" id="chatMenuPanel">
          <button id="viewBusinessBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>View Business</button>
          <button id="reportConvBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Report Conversation</button>
          <button class="danger" id="blockUserBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>Block User</button>
        </div>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>
    <div class="typing-row" id="typingRow" style="display:none;"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>

    <div class="chat-input-row">
      <button class="chat-icon-btn" id="imageBtn" aria-label="Send image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <input type="text" id="messageInput" placeholder="Type a message…">
      <button class="send-btn" id="sendBtn" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </div>

  <div id="toast-host"></div>
</div>

<!-- Delete message confirm -->
<div class="modal-overlay" id="deleteMsgModal">
  <div class="modal-sheet">
    <button class="modal-close" id="closeDeleteMsgModal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3>Delete this message?</h3>
    <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:16px;">This will be replaced with "Message deleted" for both of you.</div>
    <button class="modal-submit-btn danger" id="confirmDeleteMsgBtn">Delete Message</button>
  </div>
</div>

<!-- Report conversation -->
<div class="modal-overlay" id="reportModal">
  <div class="modal-sheet">
    <button class="modal-close" id="closeReportModal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3>Report Conversation</h3>
    <textarea id="reportReason" placeholder="What's going on? (required)"></textarea>
    <button class="modal-submit-btn danger" id="submitReportBtn">Submit Report</button>
  </div>
</div>

<!-- Block confirm -->
<div class="modal-overlay" id="blockModal">
  <div class="modal-sheet">
