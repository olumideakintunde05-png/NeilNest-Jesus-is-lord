<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #000; --surface-0: #0a0a0a; --surface-1: #101010; --surface-2: #141414;
    --surface-3: #1a1a1a; --surface-4: #1e1e1e;
    --text-primary: #fff; --text-secondary: #a8a8a8; --text-faint: #7a7a7a; --text-dim: #6e6e6e;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --gold: #e0a83c; --gold-deep: #d99a2b; --gold-text-on: #1a1200;
    --success: #37c65f; --danger: #e14b4b;
  }
  [data-theme="light"] {
    --bg: #F7F7F9; --surface-0: #FFFFFF; --surface-1: #FFFFFF; --surface-2: #FFFFFF;
    --surface-3: #F0EFF3; --surface-4: #E8E7EC;
    --text-primary: #1A1A1E; --text-secondary: #46424F; --text-faint: #6B6875; --text-dim: #8A8694;
    --border: #E8E7EC; --border-strong: #DAD8E0;
    --gold: #C7862A; --gold-deep: #B8791F; --gold-text-on: #1a1200;
    --success: #157F41; --danger: #D14343;
  }
  html, body { background: var(--bg); height: 100%; }
  body { font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--text-primary); font-size: 14px; line-height: 1.4; transition: background 0.25s ease, color 0.25s ease; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a:active, button:active { opacity: 0.72; }

  .app-shell { max-width: 390px; margin: 0 auto; min-height: 100dvh; padding: 20px 20px 50px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }

  .top-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .back-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .top-title { font-size: 20px; font-weight: 800; }
  .top-subtitle { color: var(--text-secondary); font-size: 13.5px; margin: 4px 0 20px 50px; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat-card { flex: 1; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; }
  .stat-card .num { font-size: 20px; font-weight: 800; color: var(--gold); }
  .stat-card .lbl { font-size: 10.5px; color: var(--text-secondary); margin-top: 2px; }

  .lesson-card { display: flex; gap: 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .lesson-thumb { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; background: var(--surface-4); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .lesson-thumb svg { width: 22px; height: 22px; color: var(--gold); }
  .lesson-body { flex: 1; min-width: 0; }
  .lesson-title { font-size: 13.5px; font-weight: 800; }
  .lesson-meta { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
  .lesson-status { font-size: 9.5px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; margin-top: 6px; display: inline-block; }
  .lesson-status--completed { background: rgba(52,168,83,0.18); color: #8fe3a8; }
  .lesson-status--in_progress { background: rgba(224,168,60,0.18); color: #f0cf8e; }
  .lesson-status--not_started { background: var(--surface-4); color: var(--text-secondary); }

  .empty-note { text-align: center; color: var(--text-dim); font-size: 12.5px; padding: 40px 0; }
  .locked-wrap { text-align: center; padding: 60px 20px; }
  .locked-icon { width: 60px; height: 60px; border-radius: 50%; background: rgba(224,168,60,0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .locked-icon svg { width: 26px; height: 26px; color: var(--gold); }
  .locked-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .locked-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 22px; }
  .locked-btn { display: inline-block; padding: 13px 26px; border-radius: 14px; background: linear-gradient(135deg, #f0bd5a, var(--gold-deep)); color: var(--gold-text-on); font-weight: 800; font-size: 14px; }

  .skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: skel 1.4s ease infinite; border-radius: 16px; height: 88px; margin-bottom: 12px; }
  @keyframes skel { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  #toast-host { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 40px); max-width: 350px; }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 14px; padding: 13px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

  /* =====================================================================
     DESKTOP (≥960px) — sidebar nav (this page has no bottom nav of its
     own, since it's reached via navigation, not a tab), wider shell,
     lesson cards go multi-column.
  ===================================================================== */
  .desktop-sidebar { display: none; }
  @media (min-width: 960px) {
    body { display: flex; }
    .desktop-sidebar {
      display: flex; flex-direction: column; gap: 4px;
      position: fixed; left: 0; top: 0; bottom: 0; width: 232px;
      padding: 24px 14px; background: var(--surface-0); border-right: 1px solid var(--border);
      z-index: 50;
    }
    .desktop-sidebar__brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
    .desktop-sidebar__brand img { width: 34px; height: 34px; }
    .desktop-sidebar__brand-name { font-size: 17px; font-weight: 700; }
    .desktop-sidebar a.nav-item {
      flex: none; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 12px; color: var(--text-secondary);
    }
    .desktop-sidebar a.nav-item svg { width: 20px; height: 20px; }
    .desktop-sidebar a.nav-item span { font-size: 14px; font-weight: 600; }
    .desktop-sidebar a.nav-item:hover { background: rgba(255,255,255,0.05); }
    .desktop-sidebar a.nav-item.active { background: rgba(224,168,60,0.12); color: var(--gold); }
    #lessonsList { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
    .lesson-card { margin-bottom: 0; }
    #toast-host { left: calc(50% + 116px); }
  }
</style>
</head>
