<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verify your email — NeilNest</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #000; height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    color: #fff; font-size: 14px; line-height: 1.4;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
  button:active { opacity: 0.72; }

  .auth-shell {
    max-width: 390px; margin: 0 auto; min-height: 100dvh;
    padding: 60px 28px 40px; display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .icon-wrap {
    width: 108px; height: 108px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(224,168,60,0.22), rgba(224,168,60,0.04));
    border: 1px solid rgba(224,168,60,0.25);
    display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
  }
  .icon-wrap svg { width: 50px; height: 50px; color: #e0a83c; }

  h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
  .subtitle { color: #a8a8a8; font-size: 14px; line-height: 1.6; }
  .email-value { color: #fff; font-weight: 700; margin-top: 4px; display: block; word-break: break-all; }

  .btn {
    height: 52px; border-radius: 14px; display: flex; align-items: center;
    justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; width: 100%;
  }
  .btn-primary { background: linear-gradient(135deg, #f0c25c 0%, #dd9c2c 100%); color: #1a1200; }
  .btn-secondary { background: #141414; border: 1px solid rgba(255,255,255,0.1); color: #fff; }
  .btn:disabled { opacity: 0.45; }

  .actions { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 36px; }
  .back-link { margin-top: 22px; font-size: 13px; color: #a8a8a8; }
  .back-link a { color: #e0a83c; font-weight: 700; }

  #toast-host { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 40px); max-width: 350px; }

  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(26,18,0,0.3); border-top-color: #1a1200; animation: spin 0.7s linear infinite; }
  .spinner-light { border-color: rgba(255,255,255,0.25); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
  </div>

  <h1>Verify your email</h1>
  <p class="subtitle">We've sent a verification link to:<span class="email-value" id="userEmail">—</span></p>
  <p class="subtitle" style="margin-top:14px;">Please check your inbox and click the verification link before continuing.</p>

  <div class="actions">
    <button class="btn btn-secondary" id="openEmailBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
      Open Email App
    </button>
    <button class="btn btn-secondary" id="resendBtn">
      <span id="resendLabel">Resend Email</span>
    </button>
    <button class="btn btn-primary" id="verifiedBtn">
      I've Verified My Email
    </button>
  </div>

  <div class="back-link"><a href="signin.html" id="backToLoginLink">Back to Login</a></div>
</div>

<div id="toast-host"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="auth.js"></script>
<script src="verify-email.js"></script>
</body>
</html>
